<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 50% 0,#fffdf8 0,#f6f3ea 64%);color:var(--ink);font-family:Georgia,"Noto Serif SC","Songti SC",serif}button{font:inherit;color:inherit}a{color:inherit}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}.hero{padding:64px 0 44px;text-align:center;border-bottom:1px solid var(--line)}.brand{font:600 12px/1.4 system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}h1{font-size:clamp(36px,6vw,64px);font-weight:500;letter-spacing:.035em;margin:18px 0 8px}.byline{font-size:15px;color:#65736c;letter-spacing:.12em}.dates{margin-top:18px;color:var(--muted);font:13px system-ui,sans-serif;letter-spacing:.08em}.lede{max-width:650px;margin:26px auto 0;color:#53635b;line-height:1.9;font-size:16px}.contents{padding:32px 0 18px}.contents-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px}.contents h2{font-size:24px;font-weight:500;margin:0}.contents small{color:var(--muted);font:13px system-ui,sans-serif}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 30px}.tab{border:1px solid var(--line);background:#ffffff82;border-radius:999px;padding:10px 16px;cursor:pointer;font-size:14px;transition:.2s}.tab:hover,.tab.active{background:var(--teal);border-color:var(--teal);color:#fff}.series{margin:30px 0 50px;scroll-margin-top:20px}.series-head{display:flex;justify-content:space-between;align-items:start;gap:22px;margin-bottom:18px;padding:0 2px}.series-title{font-size:23px;margin:0 0 5px;font-weight:500}.series-sub{font-size:14px;color:var(--gold);letter-spacing:.04em}.series-desc{font-size:14px;color:var(--muted);line-height:1.7;max-width:520px;text-align:right}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.chapter{display:block;text-decoration:none;background:var(--card);border:1px solid #e7e0d0;border-radius:10px;overflow:hidden;box-shadow:var(--shadow);transition:transform .22s,box-shadow . @media(max-width:760px){.wrap{width:min(100% - 28px,600px)}.hero{padding:42px 0 32px}.lede{font-size:15px}.contents-head{align-items:start;flex-direction:column}.series-head{display:block}.series-desc{text-align:left;margin-top:9px}.grid{grid-template-columns:repeat(2,1fr);gap:11px}.chapter-copy{padding:10px}.chapter h3{font-size:14px}.chapter p{font-size:12px}.viewer{padding:58px 8px 60px}.viewer img{max-width:100%;max-height:100%}.navbtn{width:40px;height:52px;background:#101c1a9c}.prev{left:8px}.next{right:8px}.vtop{left:12px;right:12px;top:10px}.vbottom{bottom:10px;gap:8px}.hint{display:none}.iconbtn{width:36px;height:36px}}

<script type="application/json" id="bookData">{"title":"What I Have Lived For","author":"Bertrand Russell","dateRange":"2026.11.07 — 2026.11.09","series":[{"id":"first-seven","title":"初读七章 · 三种热情","subtitle":"从背诵记忆到爱、求知与悲悯","description":"回到女仆咖啡馆的初次共读。知远背诵罗素，伙伴们陪他逐段走进三种支配人生的热情。","items":[{"number":"EP01","title":"三种热情：爱、求知与悲悯","summary":"三种力量如何共同支配一生？","image":"images/first-seven/01.webp","width":1672,"height":941},{"number":"EP02","title":"爱之火：狂喜","summary":"短暂的喜悦为何如此珍贵？","image":"images/first-seven/02.webp","width":1671,"height":941},{"number":"EP03","title":"爱之海：孤独与归途","summary":"爱的第二层意义：照亮彻骨孤独。","image":"images/first-seven/03.webp","width":1670,"height":941},{"number":"EP04","title":"爱之镜：微缩天国","summary":"在爱的结合中，预先看见微小的天国。","image":"images/first-seven/04.webp","width":1670,"height":941},{"number":"EP05","title":"星辰、数字与知识","summary":"追问人心、星辰与数字秩序。","image":"images/first-seven/05.webp","width":1670,"height":941},{"number":"EP06","title":"回到人间的善意","summary":"从高空回到现实，听见受苦者的回声。","image":"images/first-seven/06.webp","width":1670,"height":941},{"number":"EP07","title":"值得重演的一生","summary":"爱、求知与悲悯汇成愿意再活一次的人生。","image":"images/first-seven/07.webp","width":1670,"height":941}]},{"id":"star-lan-seven","title":"星澜的七词星旅","subtitle":"一词一世界 · 第三季","description":"七个关键词化作一场星际契约冒险：从召唤、偏航与苦痛，到深海、预示、回响与重逢。","items":[{"number":"EP00","title":"七词启程：人物与背景","summary":"在护士站的星港，七词旅程正式启航。","image":"images/star-lan-seven/01.webp","width":1672,"height":941},{"number":"EP01","title":"第一颗星：overwhelmingly","summary":"强烈到无法忽视的召唤，开启异世界旅程。","image":"images/star-lan-seven/02.webp","width":1672,"height":941},{"number":"EP02","title":"偏航星途：wayward","summary":"偏离航线，也可能成为故事的线索。","image":"images/star-lan-seven/03.webp","width":1672,"height":941},{"number":"EP03","title":"古城之痛：anguish","summary":"在古城灯火中，理解深切的苦痛与陪伴。","image":"images/star-lan-seven/04.webp","width":1672,"height":941},{"number":"EP04","title":"深不见底的星之海：unfathomable","summary":"与星澜携手潜入深海，找到通往彼岸的路。","image":"images/star-lan-seven/05.webp","width":1672,"height":941},{"number":"EP05","title":"预示相遇的星图：prefiguring","summary":"相遇写在星图里，未来仍由两人共同绘制。","image":"images/star-lan-seven/06.webp","width":1672,"height":941},{"number":"EP06","title":"让星辰共鸣的誓言：reverberate","summary":"誓言穿过沉寂星域，让群星重新回响。","image":"images/star-lan-seven/07.webp","width":1672,"height":941},{"number":"EP07","title":"重逢的狂喜：ecstasy","summary":"旅程终点，兑现一路同行的承诺。","image":"images/star-lan-seven/08.webp","width":1672,"height":941},{"number":"回顾","title":"七词归航·庆功夜","summary":"回到女仆馆，串联七个关键词。","image":"images/star-lan-seven/09.webp","width":1672,"height":941}]},{"id":"full-ten","title":"全文共读十一章","subtitle":"在女仆咖啡馆走完整篇人生告白","description":"从三种热情出发，经过爱、求知与人间苦难，最终抵达“值得活过，也愿意再活一次”。","items":[{"number":"EP01","title":"三种热情","summary":"爱、求知与悲悯，支配着罗素的一生。","image":"images/full-ten/01.webp","width":1672,"height":941},{"number":"EP02","title":"被狂风吹向何方","summary":"三种热情像大风，带他穿过悲苦的海洋。","image":"images/full-ten/02.webp","width":1672,"height":941},{"number":"EP03","title":"爱的狂喜","summary":"短暂的狂喜为何值得倾尽一生？","image":"images/full-ten/03.webp","width":1672,"height":941},{"number":"EP04","title":"世界边缘的孤独","summary":"一个颤抖的意识望向深不可测的深渊。","image":"images/full-ten/04.webp","width":1672,"height":941},{"number":"EP05","title":"微缩的天国","summary":"爱的结合，仿佛预先照见想象中的天国。","image":"images/full-ten/05.webp","width":1672,"height":941},{"number":"EP06","title":"星辰为何闪耀","summary":"求知追问人心、群星与数字秩序。","image":"images/full-ten/06.webp","width":1672,"height":941},{"number":"EP07","title":"所求有限，仍愿求知","summary":"坦然承认所获不多，求知之心仍不熄灭。","image":"images/full-ten/07.webp","width":1672,"height":941},{"number":"EP08","title":"大地传来的回声","summary":"爱与知识将人带向天空，苦难却让他回到大地。","image":"images/full-ten/08.webp","width":1672,"height":941},{"number":"EP09","title":"仍想减轻一点苦难","summary":"不能一次消除苦难，仍可从眼前行动。","image":"images/full-ten/09.webp","width":1672,"height":941},{"number":"EP10","title":"我愿再活一次","summary":"这人生值得活过；若有机会，仍愿重来。","image":"images/full-ten/10.webp","width":1672,"height":941},{"number":"EP11","title":"全文共读","summary":"罗素《What I Have Lived For》完整英文原文，作为全篇共读终章。","image":"images/full-ten/11.webp","width":1920,"height":1080}]}]}</script>
<script>
const data=JSON.parse(document.getElementById('bookData').textContent);
let activeSeries=0,activePage=0,touchX=0;
const $=s=>document.querySelector(s);
const safe=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const storeKey='wilf-ebook-progress-v1';
function saveProgress(){try{localStorage.setItem(storeKey,JSON.stringify({series:activeSeries,page:activePage}));}catch{}}
function loadProgress(){try{return JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{return {}}}
function render(){
 $('#dateRange').textContent=data.dateRange;
 $('#count').textContent=`${data.series.length} 套漫画 · ${data.series.reduce((n,s)=>n+s.items.length,0)} 幅作品`;
 const tabs=$('#tabs'),cat=$('#catalog');
 tabs.innerHTML='';cat.innerHTML='';
 data.series.forEach((s,si)=>{
  const b=document.createElement('button');b.className='tab'+(si===activeSeries?' active':'');b.textContent=`0${si+1} · ${s.title}`;b.onclick=()=>document.getElementById(s.id).scrollIntoView({behavior:'smooth'});tabs.appendChild(b);
  const sec=document.createElement('section');sec.className='series';sec.id=s.id;
  sec.innerHTML=`<div class="series-head"><div><h2 class="series-title">${safe(s.title)}</h2><div class="series-sub">${safe(s.subtitle)}</div></div><div class="series-desc">${safe(s.description)}</div></div><div class="grid">${s.items.map((it,pi)=>`<a class="chapter" href="#${s.id}-${pi+1}" data-series="${si}" data-page="${pi}" aria-label="打开 ${safe(it.number)} ${safe(it.title)}"><span class="thumb-frame" style="aspect-ratio:${it.width} / ${it.height}"><img class="thumb" src="${it.image}" alt="${safe(it.title)}" loading="lazy"></span><div class="chapter-copy"><div class="chapter-top"><span class="ep">${safe(it.number)}</span><h3>${safe(it.title)}</h3></div><p>${safe(it.summary)}</p></div></a>`).join('')}</div>`;
  sec.querySelectorAll('.chapter').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();openReader(si,+a.dataset.page)}));cat.appendChild(sec);
 });
 const p=loadProgress(); if(Number.isInteger(p.series)&&data.series[p.series]&&Number.isInteger(p.page)&&data.series[p.series].items[p.page]){activeSeries=p.series;activePage=p.page;}
 updateTabs();
}
function updateTabs(){document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===activeSeries))}
function openReader(si,pi){activeSeries=si;activePage=pi;updateReader();$('#viewer').classList.add('open');document.body.style.overflow='hidden';history.replaceState(null,'',`#${data.series[si].id}-${pi+1}`);saveProgress();}
function updateReader(){const s=data.series[activeSeries],it=s.items[activePage];$('#pageImg').src=it.image;$('#pageImg').alt=`${s.title} ${it.number} ${it.title}`;$('#vtitle').textContent=`${s.title}　/　${it.number} ${it.title}`;$('#counter').textContent=`${activePage+1} / ${s.items.length}`;$('#bar').style.width=`${(activePage+1)/s.items.length*100}%`;saveProgress()}
function closeReader(){const v=$('#viewer');v.classList.remove('open');document.body.style.overflow='';history.replaceState(null,'',location.pathname+location.search);if(document.fullscreenElement)document.exitFullscreen?.().catch(()=>{});}
function changePage(d){const items=data.series[activeSeries].items;activePage=Math.max(0,Math.min(items.length-1,activePage+d));updateReader();}
$('#closeBtn').onclick=closeReader;$('#prevBtn').onclick=()=>changePage(-1);$('#nextBtn').onclick=()=>changePage(1);
$('#fullBtn').onclick=()=>{const el=$('#viewer');if(!document.fullscreenElement)el.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.().catch(()=>{})};
document.addEventListener('keydown',e=>{if(!$('#viewer').classList.contains('open'))return;if(e.key==='Escape'){closeReader()}else if(e.key==='ArrowRight'){changePage(1)}else if(e.key==='ArrowLeft'){changePage(-1)}});
const v=$('#viewer');v.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX},{passive:true});v.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>45)changePage(dx<0?1:-1)},{passive:true});
render();
</script>
</body></html>
